<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Student</title><style>body{font-family:Arial;background:#f4f6f9}.wrap{max-width:700px;margin:50px auto}.card{background:#fff;padding:30px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-weight:bold}input,select{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ddd;border-radius:7px}button{margin-top:22px;padding:12px 20px;background:#17233f;color:#fff;border:0;border-radius:7px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="/students">← Students</a><div class="card"><h1>Add Student</h1><form method="POST"><div class="grid"><div><label>Name</label><input name="name" required></div><div><label>Roll Number</label><input name="roll_number" required></div><div><label>Email</label><input type="email" name="email"></div><div><label>Phone</label><input name="phone"></div><div><label>Department</label><input name="department"></div><div><label>Semester</label><select name="semester"><option>1st Semester</option><option>2nd Semester</option><option>3rd Semester</option><option>4th Semester</option><option>5th Semester</option><option>6th Semester</option></select></div></div><button>Add Student</button></form></div></div></body></html>
