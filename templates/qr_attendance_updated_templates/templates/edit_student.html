<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Edit Student</title><style>body{font-family:Arial;background:#f4f6f9}.wrap{max-width:700px;margin:50px auto}.card{background:#fff;padding:30px;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}input,select{width:100%;padding:12px;margin-top:7px;box-sizing:border-box}button{margin-top:20px;padding:12px 20px;background:#17233f;color:#fff;border:0;border-radius:7px}</style></head><body><div class="wrap"><a href="/students">← Students</a><div class="card"><h1>Edit Student</h1><form method="POST"><div class="grid"><div><label>Name</label><input name="name" value="{{ student.name }}" required></div><div><label>Roll Number</label><input name="roll_number" value="{{ student.roll_number }}" required></div><div><label>Email</label><input name="email" value="{{ student.email or '' }}"></div><div><label>Phone</label><input name="phone" value="{{ student.phone or '' }}"></div><div><label>Department</label><input name="department" value="{{ student.department or '' }}"></div><div><label>Semester</label><input name="semester" value="{{ student.semester or '' }}"></div><div><label>Status</label><select name="status"><option {% if student.status=='Active' %}selected{% endif %}>Active</option><option {% if student.status!='Active' %}selected{% endif %}>Inactive</option></select></div></div><button>Save Changes</button></form></div></div></body></html>
