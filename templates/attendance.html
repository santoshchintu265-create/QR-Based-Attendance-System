<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Attendance</title><style>body{font-family:Arial;background:#f4f6f9;color:#172033}.wrap{max-width:1200px;margin:35px auto;padding:20px}.filters,.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select{padding:11px;border:1px solid #ddd;border-radius:7px}button{padding:11px 18px;background:#17233f;color:#fff;border:0;border-radius:7px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}th{background:#243f88;color:#fff}.green{color:#168a55;font-weight:bold}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><a href="/">← Dashboard</a><h1>Attendance</h1><p>Review attendance records by date, subject, semester and section.</p><form class="filters" method="GET"><input type="date" name="date" value="{{ date_filter }}"><select name="subject"><option value="">All Subjects</option>{% for x in subjects %}<option value="{{ x }}" {% if selected_subject==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="semester"><option value="">All Semesters</option>{% for x in semesters %}<option value="{{ x }}" {% if selected_semester==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select><select name="section"><option value="">All Sections</option>{% for x in sections %}<option value="{{ x }}" {% if selected_section==x %}selected{% endif %}>{{ x }}</option>{% endfor %}<button>Apply Filters</button></form><div class="card"><b>{{ records|length }}</b> attendance records found</div><table><thead><tr><th>Student</th><th>Roll Number</th><th>Subject</th><th>Semester</th><th>Section</th><th>Time</th><th>Status</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.student.name }}</td><td>{{ r.student.roll_number }}</td><td>{{ r.session.subject }}</td><td>{{ r.session.semester }}</td><td>{{ r.session.section }}</td><td>{{ r.scanned_at.strftime('%d %b %Y, %I:%M %p') }}</td><td class="green">{{ r.status }}</td></tr>{% else %}<tr><td colspan="7">No attendance records found.</td></tr>{% endfor %}</tbody></table></div></body></html>
