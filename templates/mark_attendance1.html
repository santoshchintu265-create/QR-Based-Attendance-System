<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance | QR Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="student-attendance-page">

        <div class="attendance-mobile-card">


            <!-- LOGO -->

            <div class="attendance-logo">
                QR
            </div>


            <!-- HEADER -->

            <div class="attendance-page-header">

                <p class="attendance-label">
                    QR ATTENDANCE
                </p>

                <h1>
                    Mark Your Attendance
                </h1>

                <p>
                    Your QR scan was successful.
                    Verify your details to continue.
                </p>

            </div>


            <!-- SESSION INFORMATION -->

            <div class="student-session-info">

                <div class="session-subject">
                    Data Structures & Algorithms
                </div>

                <div class="session-class">
                    5th Semester • Section A
                </div>

                <div class="session-time">

                    Session expires in

                    <strong>
                        08:32
                    </strong>

                </div>

            </div>


            <!-- STUDENT FORM -->

            <form
                action="/mark-attendance"
                method="POST"
                class="attendance-form"
            >


                <!-- ROLL NUMBER -->

                <div class="form-field">

                    <label for="roll_number">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="roll_number"
                        name="roll_number"
                        placeholder="Enter your roll number"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- NAME -->

                <div class="form-field">

                    <label for="student_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="student_name"
                        name="student_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- CONFIRM -->

                <button
                    type="submit"
                    class="confirm-attendance-btn"
                >
                    Confirm Attendance
                </button>

            </form>


            <!-- SECURITY NOTE -->

            <div class="attendance-security">

                <span>🔒</span>

                <p>
                    Your attendance can only be marked once
                    for this session.
                </p>

            </div>


            <!-- FOOTER -->

            <div class="attendance-footer">
                QR Attendance System © 2026
            </div>


        </div>

    </main>

</body>

</html>
