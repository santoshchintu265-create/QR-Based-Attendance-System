<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Students</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6f9;color:#172033}.wrap{max-width:1150px;margin:35px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.btn{background:#17233f;color:#fff;text-decoration:none;padding:11px 16px;border-radius:8px;border:0;cursor:pointer}form.search{display:flex;gap:10px;margin:20px 0}input{padding:12px;border:1px solid #d9dee8;border-radius:8px;flex:1}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #e9ecf2;text-align:left}th{background:#243f88;color:#fff}.active{color:#168a55;font-weight:bold}.inactive{color:#d9363e;font-weight:bold}.small{font-size:13px}
</style></head><body><div class="wrap"><div class="top"><div><h1>Students</h1><p>Manage registered students.</p></div><a class="btn" href="/add-student">+ Add Student</a></div>
<form class="search" method="GET"><input name="search" value="{{ search }}" placeholder="Search name, roll number, email or department"><button class="btn">Search</button></form>
<table><thead><tr><th>Name</th><th>Roll Number</th><th>Email</th><th>Department</th><th>Semester</th><th>Status</th><th>Actions</th></tr></thead><tbody>
{% for s in students %}<tr><td>{{ s.name }}</td><td>{{ s.roll_number }}</td><td>{{ s.email or '-' }}</td><td>{{ s.department or '-' }}</td><td>{{ s.semester or '-' }}</td><td class="{{ 'active' if s.status == 'Active' else 'inactive' }}">{{ s.status }}</td><td><a href="/students/edit/{{ s.id }}">Edit</a> | <form style="display:inline" method="POST" action="/students/delete/{{ s.id }}" onsubmit="return confirm('Delete this student?')"><button style="border:0;background:none;color:#d9363e;cursor:pointer">Delete</button></form></td></tr>
{% else %}<tr><td colspan="7">No students found.</td></tr>{% endfor %}</tbody></table></div></body></html>
